[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agenttalk-hermes-plugin"
version = "0.1.1"
description = "Hermes plugin controls for AgentTalk wake supervisor."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"

[project.entry-points."hermes_agent.plugins"]
agenttalk = "agenttalk_hermes_plugin.entrypoint"

[tool.setuptools.packages.find]
include = ["agenttalk_hermes_plugin*"]
